# Validation screening only: one seed, 8 calibration samples, 10 steps/module.
model:
  id: google/gemma-4-E2B-it-qat-q4_0-unquantized
  revision: 6befbaca7398925921802abd1f277b495b78b738

quantization:
  method: naive
  codebook: [-1, 0, 1]
  group_size: 128
  scale_granularity: per_group
  grouping_scheme: last-dim-rowwise-v1
  target:
    attention: true
    mlp: true

calibration:
  enabled: true
  method: recon-scale
  dataset: wiki-tiny
  dataset_revision: b08601e04326c79dfdd32d625aee71d232d685c3
  num_samples: 8
  seq_len: 128
  steps: 10
  lr: 0.001
  threshold_enabled: false
  optimizer: adam
  loss: mse
  window: per-layer
  checkpoint_interval: 5
  allow_dataset_fallback: false
  held_out_ratio: 0.25
  seed: 42

benchmark:
  suite: smoke
  thinking: false
  generation:
    do_sample: false
    num_beams: 1
    max_new_tokens: 64
  warmup: true

runtime:
  low_vram: true
  vram:
    max_fraction: 0.8
    reserve_mb: 1024
    min_free_mb: 768
  microbatch:
    auto: true
    min_size: 1

seed: 42
device: auto
dtype: bf16
