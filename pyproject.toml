[project]
name = "openternary"
version = "0.1.0a0"
description = "Open-source tooling for researching ternary LLMs (Gemma 4 E2B first target)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "OpenTernary" }]
keywords = ["llm", "quantization", "ternary", "gemma"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "rich>=13",
    "psutil>=6",
    "filelock>=3",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
ml = [
    "torch>=2.5",
    "safetensors>=0.4",
    "transformers>=5.6.2,<6",
    "accelerate>=0.30",
    "pillow>=12.3.0",
    "torchvision>=0.28.0",
]
calibration = [
    "datasets>=2.18",
]

[project.scripts]
openternary = "openternary.cli.main:app"

[project.urls]
Repository = "https://github.com/ELRdn/OpenTernary"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.16",
    "mypy>=1.10",
    "types-PyYAML",
    "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openternary"]

[tool.uv]
required-version = "==0.12.5"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", ".uv-cache", ".tmp", ".pytest-tmp", "runs", "OpenTernary-initial-docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/openternary"]
