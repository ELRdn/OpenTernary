name: Docs

# Builds the documentation site (mkdocs.yml, website/) and publishes it to GitHub Pages from main.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "mkdocs.yml"
      - "src/openternary/cli/**"
      - "src/openternary/config/**"
      - "tests/test_docs.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - "mkdocs.yml"
      - "src/openternary/cli/**"
      - "src/openternary/config/**"
      - "tests/test_docs.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies (locked, with the docs group)
        run: uv sync --locked --group docs
      - name: Reference pages match the CLI and configuration
        run: uv run --frozen pytest -q tests/test_docs.py
      - name: "Build (strict: warnings and broken links fail)"
        run: uv run --frozen mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
